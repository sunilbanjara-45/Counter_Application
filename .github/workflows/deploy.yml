# .github/workflows/deploy.yml
name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Kaun si branch deploy karni hai"
        default: main
      environment:
        description: "Where to deploy"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      ref:
        description: "Branch, tag, or commit to deploy"
        required: true
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # enables secrets + approvals per environment

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/myapp
            git fetch --all
            git checkout ${{ inputs.ref }}
            npm ci --omit=dev
            npm run build
            pm2 restart myapp