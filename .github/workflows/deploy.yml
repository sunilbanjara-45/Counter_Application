name: Manual Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Kaun si branch deploy karni hai"
        required: true
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist        # Create React App ho to "build" likho

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4