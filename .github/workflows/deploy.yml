name: Deploy to Production
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy
        run: |
          if [ -d dist ]; then OUT=dist; else OUT=build; fi
          REL=/var/www/counter/releases/${{ github.sha }}
          mkdir -p $REL
          cp -r $OUT/. $REL/
          ln -sfn $REL /var/www/counter/current
          cd /var/www/counter/releases && ls -1t | tail -n +6 | xargs -r rm -rf